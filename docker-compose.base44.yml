services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:5000"
    command: >
      bash -c "pip install -r requirements.txt --quiet && python zondi.py"
    environment:
      - PORT=5000
      - FLASK_DEBUG=1
    restart: unless-stopped
