<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>ZONDI LOGIN</title>
<style>body{background:#000;color:#FFD700;font-family:Arial;text-align:center;padding:15px}.box{border:3px solid #FFD700;padding:20px;border-radius:15px;max-width:380px;margin:auto;background:#111}input{width:90%;padding:12px;margin:8px;border:2px solid #FFD700;border-radius:10px}button{width:95%;padding:14px;background:#FFD700;color:#000;font-weight:bold;border:none;border-radius:10px}</style></head><body>
<img src="/static/logo.png" style="width:140px;border:2px solid #FFD700;border-radius:15px" onerror="this.style.display='none'">
<h2>ZONDI PATROL</h2>
<div class="box">
{% if error %}<p style="background:red;color:#fff;padding:8px;border-radius:5px">{{error}}</p>{% endif %}
{% if success %}<p style="background:green;color:#fff;padding:8px;border-radius:5px">{{success}}</p>{% endif %}
<form method="POST" action="/login">
<input name="username" placeholder="Username" required>
<input name="password" type="password" placeholder="Password" required>
<button type="submit">LOGIN 📻</button>
</form>
<p><a href="/register" style="color:#FFD700">Create Account</a> | <a href="/forgot" style="color:orange">Forgot Password?</a></p>
</div>
</body></html>
