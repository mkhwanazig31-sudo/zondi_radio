<!DOCTYPE html>
<html><head><title>ZPS HQ PATROL LIVE</title><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{background:#000;color:#FFD700;font-family:Arial;margin:0}
#top{background:#FFD700;color:#000;padding:12px;font-weight:bold;display:flex;justify-content:space-between}
#map{height:55vh;border:3px solid #FFD700}
#clients{max-height:20vh;overflow:auto;background:#111;padding:5px}
.client{background:#222;margin:3px;padding:8px;border-radius:6px;color:#fff;display:flex;justify-content:space-between}
.panic{border:2px solid red;background:#330000}
#radio{background:#0f2020;padding:10px}
.bubble{background:#dcf8c6;color:#000;padding:8px;border-radius:10px;margin:5px 0;display:flex;justify-content:space-between;align-items:center}
.mic{width:140px;height:140px;background:#ff8c00;border-radius:50%;border:6px solid #fff;margin:12px auto;display:flex;align-items:center;justify-content:center;font-size:45px;cursor:pointer}
.mic:active{background:red;transform:scale(0.92)}
</style>
</head><body>
<div id="top"><span>🚔 HQ LIVE - {{user}}</span><span><a href="/logout" style="color:#000">LOGOUT</a></span></div>
<div id="map"></div>
<div id="clients"><p style="padding:10px;color:#aaa">Waiting for clients... client must open /client and allow location</p></div>

<div id="radio">
<div style="display:flex;justify-content:space-between"><b>📻 RADIO CH <span id="chNum">1</span> - <span id="status">IDLE</span></b>
<select id="chSel"><option value="ch1">CH 1 PATROL</option><option value="ch2">CH 2</option><option value="ch_all">CH ALL EMERGENCY</option></select></div>
<div id="log" style="background:#fff;height:220px;overflow:auto;padding:6px;border-radius:8px;color:#000">Waiting...</div>
<div class="mic" id="ptt">🎙️</div>
<div style="text-align:center;font-size:11px;color:#aaa">HOLD TO TALK - Live</div>
<div id="debug" style="font-size:10px;color:#666;text-align:center"></div>
</div>

<script>
let map=L.map('map').setView([-26.2041,28.0473],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let markers={}; let curCh='ch1'; let rec,chunks=[]; let lastCount=0; let me="{{user}}";

async function refreshMap(){
  let r=await fetch('/get_clients'); let data=await r.json();
  let list=document.getElementById('clients'); list.innerHTML='';
  let has=false;
  for(let u in data){
    let l=data[u]; if(!l.lat) continue; has=true;
    let pos=[l.lat,l.lng];
    if(!markers[u]) markers[u]=L.marker(pos).addTo(map).bindPopup(u);
    else markers[u].setLatLng(pos);
    list.innerHTML+=`<div class="client"><span><b>${u}</b> ${l.lat.toFixed(5)},${l.lng.toFixed(5)} ${l.time}</span><a href="https://maps.google.com/?q=${l.lat},${l.lng}" target="_blank" style="color:cyan">MAP</a></div>`;
  }
  if(!has) list.innerHTML='<p style="color:#aaa;padding:10px">No clients yet</p>';
}

async function refreshRadio(){
  let r=await fetch(`/get_audios?channel=${curCh}`); let msgs=await r.json();
  if(msgs.length>lastCount && lastCount!=0){
    let newest=msgs[msgs.length-1];
    if(newest.user!==me && newest.audioUrl){
      let a=new Audio(newest.audioUrl); a.play().catch(()=>{});
      document.getElementById('status').innerText='RX: '+newest.user;
      a.onended=()=>{document.getElementById('status').innerText='IDLE';}
    }
  }
  lastCount=msgs.length;
  let log=document.getElementById('log'); log.innerHTML='';
  msgs.slice().reverse().forEach(m=>{
    if(!m.audioUrl) return;
    log.innerHTML+=`<div class="bubble"><span>🔊 <b>${m.user}</b></span><audio controls src="${m.audioUrl}" style="width:90px;height:28px"></audio></div>`;
  });
}

document.getElementById('chSel').onchange=e=>{curCh=e.target.value; document.getElementById('chNum').innerText=curCh.replace('ch',''); lastCount=0; refreshRadio();};

async function startTx(){
  let s=await navigator.mediaDevices.getUserMedia({audio:true});
  rec=new MediaRecorder(s,{mimeType:'audio/webm;codecs=opus'}); chunks=[];
  rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
  rec.onstop=async()=>{
    let b=new Blob(chunks,{type:'audio/webm'});
    if(b.size<1500){alert('Hold longer - 2 sec min'); return;}
    let fd=new FormData(); fd.append('audio',b,'tx.webm'); fd.append('channel',curCh); fd.append('user',me);
    await fetch('/upload_audio',{method:'POST',body:fd}); refreshRadio();
  };
  rec.start(); document.getElementById('status').innerText='TX 🔴'; document.getElementById('ptt').style.background='red';
}
function stopTx(){ if(rec&&rec.state=='recording'){ rec.stop(); document.getElementById('ptt').style.background='#ff8c00'; try{rec.stream.getTracks().forEach(t=>t.stop());}catch(e){} } }

let ptt=document.getElementById('ptt');
ptt.addEventListener('mousedown',startTx); ptt.addEventListener('mouseup',stopTx);
ptt.addEventListener('touchstart',e=>{e.preventDefault(); startTx();},{passive:false});
ptt.addEventListener('touchend',e=>{e.preventDefault(); stopTx();});

setInterval(()=>{refreshMap(); refreshRadio();},2000);
refreshMap(); refreshRadio();
</script>
</body></html>
