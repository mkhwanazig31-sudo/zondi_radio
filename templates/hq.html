<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZPS V5 | OUKITEL MODE</title>
<style>
body{background:#0f2020;color:#fff;font-family:Arial;margin:0;display:flex;justify-content:center}
.phone{width:380px;background:#111;border-radius:30px;border:3px solid #333;padding:10px;margin-top:10px}
.header{display:flex;justify-content:space-between;padding:10px 15px;font-weight:bold}
.card{background:#f5f5f5;color:#000;border-radius:18px;padding:15px;margin:10px 0}
.badge{display:inline-block;background:#222;color:#FFD700;padding:4px 10px;border-radius:12px;font-size:11px;margin:2px}
.mic-btn{width:160px;height:160px;background:#ff8c00;border-radius:50%;border:8px solid #fff;box-shadow:0 0 20px #ff8c00;display:flex;align-items:center;justify-content:center;margin:15px auto;font-size:50px;cursor:pointer;transition:0.1s}
.mic-btn:active{background:#ff0000;transform:scale(0.95);box-shadow:0 0 40px red}
.log{background:#fff;border-radius:12px;height:280px;overflow-y:auto;padding:8px}
.bubble{background:#dcf8c6;padding:8px 12px;border-radius:12px;margin:6px 0;color:#000;font-size:13px;display:flex;justify-content:space-between;align-items:center}
select{width:100%;padding:10px;border-radius:10px;border:2px solid #ff8c00;font-weight:bold}
</style>
</head>
<body>
<div class="phone">
<div class="header"><span>◀ Talkie</span><span>⚙️</span></div>

<div class="card">
<div style="display:flex;justify-content:space-between;font-size:12px;color:#666"><span>Power: High</span><span>Volume: 6</span></div>
<div style="font-size:20px;font-weight:900;margin:6px 0">Channel <span id="chNum">1</span> - PATROL</div>
<div style="font-size:11px;color:#555">
<div>Transmit: 446.00625MHZ</div>
<div>Receive: 446.00625MHZ</div>
<div>Call Type: All &nbsp; Color Code: 0</div>
</div>
<select id="channelSel">
<option value="ch1">Channel 1 - 446.00625MHZ</option>
<option value="ch2">Channel 2 - 446.01875MHZ</option>
<option value="ch_all">Channel ALL - Emergency</option>
</select>
<div style="text-align:center;margin-top:8px">
<span class="badge">🔋 98%</span>
<span class="badge">📶 No Network - Radio Mode</span>
<span class="badge" style="background:#ff8c00;color:#fff" id="status">IDLE</span>
</div>
</div>

<div class="log" id="log">Waiting for radio traffic...</div>

<div class="mic-btn" id="pttBtn">🎙️</div>
<div style="text-align:center;font-size:12px;color:#aaa">HOLD TO TALK - OUKITEL WP61 Plus Style</div>
</div>

<script>
let currentChannel='ch1';
let mediaRecorder,chunks=[];
let lastCount=0;
const logEl=document.getElementById('log');
const statusEl=document.getElementById('status');
const channelSel=document.getElementById('channelSel');

channelSel.onchange=e=>{
    currentChannel=e.target.value;
    document.getElementById('chNum').innerText=e.target.value=='ch_all'?'ALL':e.target.value.replace('ch','');
    lastCount=0;
   
    // --- CRUCIAL SOUND UNLOCK FIX ---
    // Creates a silent audio snippet linked to a user gesture.
    // This officially tells the phone browser it is allowed to play radio sounds later!
    let unlockAudio = new Audio();
    unlockAudio.play().catch(() => {});
   
    fetchFeed();
};

async function fetchFeed(){
let res=await fetch(`/api/radio/feed?channel=${currentChannel}`);
let msgs=await res.json();
if(msgs.length>lastCount && lastCount!=0){
  let newest=msgs[msgs.length-1];
  let audio=new Audio(newest.audioUrl);
  audio.play();
  statusEl.innerText='RX: '+newest.user;
  statusEl.style.background='red';
  audio.onended=()=>{statusEl.innerText='IDLE';statusEl.style.background='#ff8c00';}
}
lastCount=msgs.length;
logEl.innerHTML='';
 msgs.slice().reverse().forEach(m=>{
        let div=document.createElement('div');
        div.className='bubble';
        div.innerHTML=`<span><b>${m.user}</b> • ${new Date(m.time*1000).toLocaleTimeString()}</span><br><audio controls src="${m.audioUrl}" style="width:90px;height:25px;"></audio>`;
        logEl.appendChild(div);
    });
}
setInterval(fetchFeed,1200);
fetchFeed();

async function startTx(){
let stream=await navigator.mediaDevices.getUserMedia({audio:true});
mediaRecorder=new MediaRecorder(stream);
chunks=[];
mediaRecorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
mediaRecorder.onstop=async()=>{
  statusEl.innerText='SENDING...';
  let blob=new Blob(chunks,{type:'audio/webm'});
  let fd=new FormData();
  fd.append('audio',blob,'tx.webm');
  fd.append('channel',currentChannel);
  fd.append('user','ZPS-'+Math.floor(Math.random()*89+10));
  await fetch('/api/radio/upload', {method: 'POST',body:fd});
  statusEl.innerText='IDLE';
  fetchFeed();
};
mediaRecorder.start();
statusEl.innerText='TRANSMITTING TX 🔴';
statusEl.style.background='red';
document.getElementById('pttBtn').style.background='red';
}
function stopTx(){
if(mediaRecorder && mediaRecorder.state=='recording'){
  mediaRecorder.stop();
  document.getElementById('pttBtn').style.background='#ff8c00';
}
}
const ptt=document.getElementById('pttBtn');
ptt.addEventListener('mousedown',startTx);
ptt.addEventListener('mouseup',stopTx);
ptt.addEventListener('touchstart',e=>{e.preventDefault();startTx();},{passive:false});
ptt.addEventListener('touchend',e=>{e.preventDefault();stopTx();});
</script>
</body>
</html>
