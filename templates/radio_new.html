<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>ZPS RADIO LIVE TEST</title>
<style>
body{background:#0f2020;color:#fff;font-family:Arial;margin:0;display:flex;justify-content:center}
.phone{width:380px;background:#111;border-radius:30px;border:3px solid #333;padding:10px;margin-top:10px}
.header{display:flex;justify-content:space-between;padding:10px;font-weight:bold}
.card{background:#f5f5f5;color:#000;border-radius:18px;padding:15px;margin:10px 0}
.badge{display:inline-block;background:#222;color:#FFD700;padding:4px 10px;border-radius:12px;font-size:11px;margin:2px}
.mic{width:180px;height:180px;background:#ff8c00;border-radius:50%;border:8px solid #fff;box-shadow:0 0 20px #ff8c00;display:flex;align-items:center;justify-content:center;margin:15px auto;font-size:60px;cursor:pointer;user-select:none}
.mic:active{background:red;transform:scale(0.92)}
.log{background:#fff;border-radius:12px;height:320px;overflow-y:auto;padding:8px}
.bubble{background:#dcf8c6;padding:10px;border-radius:12px;margin:8px 0;color:#000;display:flex;justify-content:space-between;align-items:center}
select{width:100%;padding:12px;border-radius:10px;border:2px solid #ff8c00;font-weight:bold;font-size:14px}
</style>
</head><body>
<div class="phone">
<div class="header"><span>📻 ZPS RADIO - {{user}}</span><a href="/dashboard" style="color:#FFD700">HQ MAP</a></div>
<div class="card">
<div style="font-weight:900;font-size:20px">Channel <span id="chNum">1</span> LIVE</div>
<select id="chSel"><option value="ch1">CH 1 - PATROL (446.00625)</option><option value="ch2">CH 2 - BACKUP</option><option value="ch_all">CH ALL - EMERGENCY</option></select>
<div style="text-align:center;margin-top:8px"><span class="badge" style="background:#0f0;color:#000" id="status">IDLE - READY TO TEST</span><span class="badge" id="cnt">0 msgs</span></div>
<div id="debug" style="font-size:10px;color:#666;text-align:center;margin-top:4px">Ready - hold button 2 sec to talk</div>
</div>
<div class="log" id="log">Waiting... open 2 phones to test LIVE</div>
<div class="mic" id="ptt">🎙️</div>
<div style="text-align:center;font-size:12px;color:#aaa">HOLD 2 SECONDS - RELEASE TO SEND - TEST NOW</div>
</div>

<script>
let cur='ch1'; let rec,chunks=[]; let last=0; let me="{{user}}";
let logEl=document.getElementById('log'); let statusEl=document.getElementById('status'); let debugEl=document.getElementById('debug');

document.getElementById('chSel').onchange=e=>{
  cur=e.target.value; document.getElementById('chNum').innerText=cur=='ch_all'?'ALL':cur.replace('ch','');
  last=0; load();
};

async function load(){
  let r=await fetch(`/get_audios?channel=${cur}`); let msgs=await r.json();
  document.getElementById('cnt').innerText=msgs.length+' msgs';
  if(msgs.length>last && last!=0){
    let n=msgs[msgs.length-1];
    if(n.user!==me && n.audioUrl){
      debugEl.innerText='🔊 INCOMING from '+n.user;
      let a=new Audio(n.audioUrl);
      a.play().then(()=>{debugEl.innerText='✅ PLAYING LIVE from '+n.user;}).catch(()=>{debugEl.innerText='⚠️ Tap the audio bar to play (browser blocked autoplay)';});
      statusEl.innerText='RX: '+n.user; statusEl.style.background='red'; statusEl.style.color='#fff';
      a.onended=()=>{statusEl.innerText='IDLE - READY'; statusEl.style.background='#0f0'; statusEl.style.color='#000';}
    }
  }
  last=msgs.length; logEl.innerHTML='';
  msgs.slice().reverse().forEach(m=>{
    if(!m.audioUrl) return;
    logEl.innerHTML+=`<div class="bubble"><div><b>${m.user}</b><br><small>${new Date(m.time*1000).toLocaleTimeString()}</small></div><audio controls preload="metadata" src="${m.audioUrl}" style="width:100px;height:32px"></audio></div>`;
  });
}

async function start(){
  try{
    let s=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(s,{mimeType:'audio/webm;codecs=opus'}); chunks=[];
    rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
    rec.onstop=async()=>{
      let b=new Blob(chunks,{type:'audio/webm'});
      debugEl.innerText='Recorded '+b.size+' bytes';
      if(b.size<2000){debugEl.innerText='❌ TOO SHORT - Hold 2 sec! Size '+b.size; statusEl.innerText='IDLE'; document.getElementById('ptt').style.background='#ff8c00'; return;}
      statusEl.innerText='SENDING...';
      let fd=new FormData(); fd.append('audio',b,'live.webm'); fd.append('channel',cur); fd.append('user',me);
      let res=await fetch('/upload_audio',{method:'POST',body:fd});
      let j=await res.json();
      debugEl.innerText='✅ SENT - Other phone will hear it NOW'; statusEl.innerText='IDLE - READY';
      document.getElementById('ptt').style.background='#ff8c00'; load();
    };
    rec.start(); statusEl.innerText='🔴 TX - TALK NOW'; document.getElementById('ptt').style.background='red'; debugEl.innerText='🔴 Recording - talk!';
  }catch(e){alert('Mic blocked - allow microphone: '+e.message); debugEl.innerText='Mic error: '+e.message;}
}

function stop(){ if(rec&&rec.state=='recording'){rec.stop(); try{rec.stream.getTracks().forEach(t=>t.stop());}catch(e){} } }

let btn=document.getElementById('ptt');
btn.addEventListener('mousedown',start); btn.addEventListener('mouseup',stop);
btn.addEventListener('touchstart',e=>{e.preventDefault(); start();},{passive:false});
btn.addEventListener('touchend',e=>{e.preventDefault(); stop();});

setInterval(load,1000); load();
</script>
</body></html>
