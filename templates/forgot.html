<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>ZPS Forgot</title>
<style>body{background:#000;color:#FFD700;font-family:Arial;text-align:center;padding:15px}.box{border:3px solid #FFD700;padding:20px;border-radius:15px;max-width:380px;margin:auto;background:#111}input{width:90%;padding:12px;margin:8px;border:2px solid #FFD700;background:#fff;color:#000;border-radius:8px}button{width:95%;padding:14px;background:red;color:#fff;font-weight:bold;border:none;border-radius:10px}</style></head><body>
<img src="/static/logo.png" style="width:120px;border:2px solid #FFD700;border-radius:15px"><h2>RESET PASSWORD</h2>
<div class="box">

<form method="POST">

<input name="new_password" type="password" placeholder="New Password" required>

<button type="submit">RESET & ENCRYPT NEW PASSWORD 🔑</button>
</form>
<p><a href="/login" style="color:cyan">Back to Login</a></p>
</div>
