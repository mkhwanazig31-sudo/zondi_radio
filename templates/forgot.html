<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZPS - Forgot Password</title>
    <style>
        body {
            background-color: #0d0f12;
            color: #c5c6c7;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .forgot-container {
            background-color: #11161d;
            border: 1px solid #232d38;
            border-radius: 8px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }
        .system-header {
            text-align: center;
            color: #3498db;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .section-title {
            text-align: center;
            color: #ffd700;
            font-size: 14px;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .error-alert {
            background-color: #2d1414;
            color: #ff4d4d;
            border-left: 4px solid #e60000;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
            margin-bottom: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
        }
        .form-group label {
            font-size: 11px;
            color: #8b9bb4;
            text-transform: uppercase;
            font-weight: bold;
        }
        .input-field {
            background-color: #1c232d;
            color: #ffffff;
            border: 1px solid #2d384c;
            border-radius: 5px;
            padding: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-field:focus {
            border-color: #3498db;
        }
        .btn-reset {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d39e00 0%, #937000 100%);
            color: #ffffff;
            border: 1px solid #ffc107;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
            font-family: monospace;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 193, 7, 0.15);
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }
        .btn-reset:active {
            transform: scale(0.99);
        }
        .login-redirect-wrapper {
            text-align: center;
            font-size: 12px;
        }
        .login-link {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }
        .login-link:hover {
            text-decoration: underline;
        }
        .footer-panel {
            text-align: center;
            font-size: 11px;
            color: #657786;
            width: 100%;
            max-width: 400px;
            margin-top: 15px;
        }
        .footer-highlight {
            color: #3498db;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- PASSWORD RECOVERY MAIN CONTAINER -->
    <div class="forgot-container">
        <div class="system-header">ZPS Forgot</div>
        <h2 class="section-title">## RESET PASSWORD</h2>

        <!-- DYNAMIC SERVER ERROR DISPATCH LOGIC (PROTECTED) -->
        {% if error %}
        <div class="error-alert">
            ❌ [RECOVERY_ERROR]: {{error}}
        </div>
        {% endif %}

        <form action="/forgot" method="POST">
            <!-- INPUT GROUPS -->
            <div class="form-group">
                <label for="username">User Identity Node</label>
                <input type="text" id="username" name="username" class="input-field" placeholder="Enter your account handle" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="new_password">New Encryption Phrase</label>
                <input type="password" id="new_password" name="new_password" class="input-field" placeholder="Enter new secure matrix key" required>
            </div>

            <!-- SUBMIT OPERATION -->
            <button type="submit" class="btn-reset">
                RESET & ENCRYPT NEW PASSWORD 🔑
            </button>
        </form>

        <!-- BACKWARD NAVIGATION LAYERS -->
        <div class="login-redirect-wrapper">
            <a href="/login" class="login-link">Back to Login</a>
        </div>
    </div>

    <!-- SIGNATURE BRAND FOOTER -->
    <div class="footer-panel">
        Designed & Developed by <a href="#" class="footer-highlight">Mkhwanazi</a>
        <br>
        <span style="color: #222b3d; font-size: 10px; display: inline-block; margin-top: 4px;">Engine: Spark | © 2026 ZPS</span>
    </div>

</body>
</html>
