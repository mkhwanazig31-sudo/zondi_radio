<!DOCTYPE html><html><head><title>ZONDI DEV LIVE</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#000;color:#FFD700;font-family:monospace;padding:10px}
.card{background:#111;border:1px solid #333;padding:8px;margin:5px 0;border-radius:6px;color:#fff}
.top{background:#222;padding:10px;display:flex;justify-content:space-between;border-radius:6px}
a{color:cyan}
</style></head><body>
<div class="top"><span>👨‍💻 DEV PANEL LIVE - {{user}}</span><span><a href="/dashboard">HQ MAP</a> | <a href="/logout">Logout</a></span></div>

<h3>📍 Live GPS - Auto Refresh (2 sec)</h3>
<div id="gps"><p>Waiting for clients...</p></div>

<h3>📁 Evidence & Radio Files</h3>
<div id="files"></div>

<h3>📻 Radio Log - Live</h3>
<div id="log" style="background:#111;padding:10px;height:350px;overflow:auto"></div>

<script>
let allFiles={{files|tojson if files is defined else []}};

async function refresh(){
  try{
    let r1=await fetch('/get_clients'); let locs=await r1.json();
    let gps=document.getElementById('gps'); gps.innerHTML='';
    for(let u in locs){
      let l=locs[u]; if(!l.lat) continue;
      gps.innerHTML+=`<div class="card"><b>${u}</b>: ${l.lat.toFixed(5)},${l.lng.toFixed(5)} at ${l.time} ${l.panic?'🚨 PANIC':''} <a href="https://maps.google.com/?q=${l.lat},${l.lng}" target="_blank">MAP</a></div>`;
    }
    if(Object.keys(locs).length==0) gps.innerHTML='<p>No GPS yet - client must open /client and ALLOW location</p>';

    let r2=await fetch('/get_radio'); let msgs=await r2.json();
    let log=document.getElementById('log'); log.innerHTML='';
    msgs.slice().reverse().forEach(m=>{
      let src=m.audioUrl||(m.file?`/evidence/${m.file}`:'');
      log.innerHTML+=`<div class="card">${m.time} - <b>${m.user}</b> CH${m.channel||1}: ${m.text||''} ${m.file?`<br><audio controls preload="metadata" src="${src}" style="width:100%"></audio><br><a href="${src}" target="_blank">DOWNLOAD ${m.file}</a>`:''}</div>`;
    });
  }catch(e){console.log(e);}
}

setInterval(refresh,2000); refresh();

let fd=document.getElementById('files');
if(!allFiles || allFiles.length==0) fd.innerHTML='<p>No files yet - talk on radio or trigger panic</p>';
else fd.innerHTML=allFiles.map(f=>`<div class="card">${f}<br><audio controls preload="metadata" src="/evidence/${f}" style="width:100%"></audio><br><a href="/evidence/${f}" target="_blank">PLAY</a> | <a href="/static/evidence/${f}" target="_blank">Alt Link</a></div>`).join('');
</script>
</body></html>
