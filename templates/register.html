<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><style>body{background:#111b21;color:#fff;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh}.box{background:#202c33;padding:20px;border-radius:12px;width:320px}input,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none;background:#2a3942;color:#fff}button{width:100%;padding:12px;background:#00a884;border:none;color:#fff;border-radius:8px}</style></head><body><div class="box"><h3>Create Account</h3>{% if error %}<div style="color:#f15c6d">{{error}}</div>{% endif %}<form method="POST"><input name="fullname" placeholder="Full Name e.g. John Nkosi" required><input name="username" placeholder="Username" required><input name="phone" placeholder="Phone Number" required><input name="password" type="password" placeholder="Password" required><select name="role"><option value="client">Client</option><option value="patrol">HQ Officer</option><option value="dev">Developer</option></select><button>Register</button></form><br><a href="/login" style="color:#00a884">Login</a></div></body></html>
