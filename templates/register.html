<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register</title>
<style>body{background:#000;color:#FFD700;font-family:Arial;text-align:center;padding:15px}.box{border:3px solid #FFD700;padding:20px;border-radius:15px;max-width:380px;margin:auto;background:#111}input,select{width:90%;padding:12px;margin:8px;border:2px solid #FFD700;border-radius:8px}button{width:95%;padding:14px;background:#FFD700;color:#000;font-weight:bold;border:none;border-radius:10px}</style></head><body>
<h2>CREATE ACCOUNT</h2>
<div class="box">
{% if error %}<p style="color:red">{{error}}</p>{% endif %}
<form method="POST"><input name="username" placeholder="Username" required><input name="email" type="email" placeholder="Email" required><select name="role"><option value="client">Client</option><option value="patrol">Patrol</option></select><input name="password" type="password" placeholder="Password" required><button type="submit">REGISTER</button></form>
<p><a href="/login" style="color:cyan">Back to Login</a></p>
</div>
</body></html>
