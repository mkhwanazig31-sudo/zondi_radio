<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZONDI HQ</title>
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{height:100vh;background:#111b21;color:#fff;font-family:system-ui;display:flex;flex-direction:column}
.top{background:#202c33;padding:10px;display:flex;justify-content:space-between}
.tabs{display:flex;background:#202c33}.tab{flex:1;padding:10px;text-align:center;cursor:pointer;color:#8696a0}.tab.active{color:#00a884;background:#2a3942}
.page{flex:1;overflow-y:auto;display:none}.page.active{display:flex;flex-direction:column}
.chat-area{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px;background:#e5ddd5;background-image:url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')}
.bub{max-width:80%;padding:6px 8px;border-radius:8px;font-size:14px}.other{background:#fff;color:#000;align-self:flex-start}.me{background:#d9fdd3;color:#000;align-self:flex-end}
.input-bar{display:flex;gap:6px;padding:8px;background:#f0f2f5}.input-bar input{flex:1;padding:12px;border-radius:20px;border:none}.mic{width:44px;height:44px;border-radius:50%;border:none;background:#00a884;color:#fff}
#map{flex:1}
.alert{background:#f15c6d;padding:10px;margin:6px;border-radius:8px;animation:blink 1s infinite} @keyframes blink{50%{opacity:.7}}
.gitem{padding:12px;background:#202c33;border-bottom:1px solid #222d34;display:flex;justify-content:space-between;cursor:pointer}
</style></head><body>
<div class="top"><b>ZONDI HQ - {{user}}</b><span><a href="/logout" style="color:#8696a0">Logout</a></span></div>
<div class="tabs">
<div class="tab active" onclick="show('chat')">💬 Chat</div>
<div class="tab" onclick="show('map')">📍 Live Map</div>
<div class="tab" onclick="show('sos')">🚨 SOS</div>
</div>

<div class="page active" id="p-chat">
<div id="groupList"></div>
<div class="chat-area" id="chatArea"><div style="text-align:center;color:#667781;margin-top:20px">Select group</div></div>
<div class="input-bar"><input id="msgInput" placeholder="Message"><button class="mic" onclick="sendText()">➤</button><button class="mic" id="micBtn" onclick="toggleVoice()">🎙️</button></div>
</div>

<div class="page" id="p-map"><div id="map"></div><div style="padding:8px;background:#202c33;font-size:12px" id="clientList">Tracking clients...</div></div>

<div class="page" id="p-sos" style="padding:10px"><h3>🚨 Panic Alerts</h3><div id="panicList"></div></div>

<script>
const socket=io(); let groups={}, cur=null, rec, chunks=[], isRec=false, map, markers={}, allLocs={};
function show(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.getElementById('p-'+n).classList.add('active'); event.currentTarget.classList.add('active'); if(n=='map'&&!map){setTimeout(initMap,100);} if(n=='sos') loadPanics();}
function initMap(){map=L.map('map').setView([-25.7,28.1],10); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); refreshLocs();}
async function refreshLocs(){let r=await fetch('/get_locations'); let locs=await r.json(); allLocs=locs; let h=''; for(let u in locs){let l=locs[u]; h+=`<div>${u}: ${l.lat.toFixed(4)},${l.lng.toFixed(4)} at ${l.time} <a href="https://maps.google.com/?q=${l.lat},${l.lng}" target="_blank" style="color:#00a884">Maps</a></div>`; if(map){if(!markers[u]) markers[u]=L.marker([l.lat,l.lng]).addTo(map).bindPopup(u); else markers[u].setLatLng([l.lat,l.lng]);}} document.getElementById('clientList').innerHTML=h||'No clients yet';}
async function loadGroups(){let r=await fetch('/api/groups'); groups=await r.json(); let h=''; for(let id in groups){let g=groups[id]; h+=`<div class="gitem" onclick="openChat('${id}')"><span>${g.name}</span><span>${g.messages.length} msgs</span></div>`;} document.getElementById('groupList').innerHTML=h;}
async function openChat(id){cur=id; socket.emit('join_group',{group:id}); let r=await fetch('/api/group_messages/'+id); groups[id].messages=await r.json(); renderChat();}
function renderChat(){if(!cur) return; let g=groups[cur]; let area=document.getElementById('chatArea'); area.innerHTML=''; g.messages.forEach(m=>{let me=m.user==='{{user}}'; let d=document.createElement('div'); d.className='bub '+(me?'me':'other'); if(m.type=='audio'){d.innerHTML=`<div style="font-size:11px;color:#00a884">${m.user}</div><audio controls src="/evidence/${m.file}" style="width:180px"></audio><div style="font-size:10px">${m.time}</div>`;} else {d.innerHTML=`<div style="font-size:11px;color:#00a884">${m.user}</div><div>${m.text}</div><div style="font-size:10px;text-align:right">${m.time} ✓✓</div>`;} area.appendChild(d);}); area.scrollTop=area.scrollHeight;}
async function sendText(){let t=document.getElementById('msgInput').value.trim(); if(!t||!cur) return; document.getElementById('msgInput').value=''; await fetch('/api/send_text',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({group:cur,text:t})});}
async function toggleVoice(){let btn=document.getElementById('micBtn'); if(!isRec){try{let s=await navigator.mediaDevices.getUserMedia({audio:true}); chunks=[]; rec=new MediaRecorder(s,{mimeType:'audio/webm'}); rec.ondataavailable=e=>{if(e.data.size>0) chunks.push(e.data)}; rec.onstop=async()=>{let blob=new Blob(chunks,{type:'audio/webm'}); if(blob.size<800) return; let fd=new FormData(); fd.append('voice',blob,'v.webm'); fd.append('group',cur); await fetch('/api/send_voice',{method:'POST',body:fd});}; rec.start(); isRec=true; btn.innerText='◼';}catch(e){alert(e.message)}} else {rec.stop(); rec.stream.getTracks().forEach(t=>t.stop()); isRec=false; btn.innerText='🎙️';}}
async function loadPanics(){let r=await fetch('/get_panic_alerts'); let alerts=await r.json(); let h=''; alerts.reverse().forEach(a=>{h+=`<div class="alert"><b>${a.message}</b><br>${a.user} at ${a.time}<br>Lat:${a.location.lat} Lng:${a.location.lng}<br><a href="https://maps.google.com/?q=${a.location.lat},${a.location.lng}" target="_blank" style="color:#fff">📍 VIEW LOCATION</a></div>`;}); document.getElementById('panicList').innerHTML=h||'No SOS yet';}
socket.on('new_msg', d=>{if(groups[d.group]){groups[d.group].messages.push(d.msg); if(cur==d.group) renderChat(); loadGroups();}});
socket.on('location_update', d=>{allLocs[d.user]=d.location; if(map){let l=d.location; if(!markers[d.user]) markers[d.user]=L.marker([l.lat,l.lng]).addTo(map).bindPopup(d.user); else markers[d.user].setLatLng([l.lat,l.lng]);} refreshLocs();});
socket.on('panic_alert', d=>{loadPanics(); alert('🚨 SOS FROM '+d.user); if(map){map.setView([d.location.lat,d.location.lng],15);}});
setInterval(refreshLocs,5000); loadGroups(); loadPanics();
</script></body></html>
