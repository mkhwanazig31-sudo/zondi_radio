<!DOCTYPE html>
<html><head><title>ZONDI - CLIENT LIVE</title><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{background:#000;color:#FFD700;font-family:Arial;margin:0;padding:10px}
.top{background:#FFD700;color:#000;padding:10px;font-weight:bold;display:flex;justify-content:space-between;border-radius:8px}
#map{height:220px;border:2px solid #FFD700;border-radius:8px;margin:5px 0}
#log{background:#111;border:1px solid #333;color:#0f0;padding:8px;font-size:11px;height:70px;overflow:auto;border-radius:6px}
video{width:100%;background:#222;height:200px;border:2px solid #FFD700;border-radius:8px}
#panic{background:red;color:#fff;font-size:18px;padding:15px;width:100%;border:none;border-radius:10px;margin-top:8px;font-weight:bold}
.btn{background:#FFD700;color:#000;padding:10px 15px;border-radius:8px;text-decoration:none;font-weight:bold;display:inline-block;margin:3px}
</style>
</head><body>
<div class="top"><span>ZPS CLIENT - {{user}}</span><a href="/logout" style="color:#000">LOGOUT</a></div>
<div id="log">DEBUG LOG:<br></div>
<div id="map"></div>
<video id="cam" autoplay muted playsinline></video>
<div style="text-align:center;margin:8px 0">
<a href="/dashboard" class="btn">📻 OPEN RADIO</a>
<a href="#" class="btn" id="gmaps" target="_blank">📍 Open Maps</a>
</div>
<button id="panic">🚨 PANIC - TAP</button>

<script>
function LOG(t){let el=document.getElementById('log'); el.innerHTML+=t+"<br>"; el.scrollTop=el.scrollHeight;}
let user="{{user}}"; LOG("User: "+user);
let map=L.map('map').setView([-26.2041,28.0473],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let marker=L.marker([-26.2041,28.0473]).addTo(map);
let lastPos=null;

function sendPos(lat,lng){
  lastPos={lat,lng};
  document.getElementById('gmaps').href=`https://maps.google.com/?q=${lat},${lng}`;
  document.getElementById('gmaps').target="_blank";
  fetch('/update_location',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:user,lat:lat,lng:lng})})
  .then(()=>LOG("📡 Sent to HQ: "+lat.toFixed(5)+","+lng.toFixed(5)));
}

if(!navigator.geolocation){LOG("❌ NO GEOLOCATION");}
else{
  LOG("Requesting GPS - ALLOW permission");
  navigator.geolocation.watchPosition(p=>{
    let lat=p.coords.latitude,lng=p.coords.longitude;
    LOG("✅ GPS LIVE: "+lat.toFixed(5)+","+lng.toFixed(5));
    marker.setLatLng([lat,lng]); map.setView([lat,lng],16);
    sendPos(lat,lng);
  },e=>{LOG("❌ GPS ERROR: "+e.message);},{enableHighAccuracy:true,maximumAge:0});
 
  setInterval(()=>{
    navigator.geolocation.getCurrentPosition(p=>{sendPos(p.coords.latitude,p.coords.longitude);},()=>{},{enableHighAccuracy:true});
  },5000);
}

navigator.mediaDevices.getUserMedia({video:true,audio:true}).then(s=>{
  LOG("✅ CAM OK"); document.getElementById('cam').srcObject=s; window.camStream=s;
}).catch(e=>{LOG("❌ CAM: "+e.message);});

document.getElementById('panic').onclick=()=>{
  LOG("🚨 PANIC!");
  if(!window.camStream){fetch('/trigger',{method:'POST'}).then(()=>LOG("✅ Panic sent")); return;}
  let rec=new MediaRecorder(window.camStream); let chunks=[];
  rec.ondataavailable=ev=>chunks.push(ev.data);
  rec.onstop=()=>{
    let b=new Blob(chunks,{type:'video/webm'}); let fd=new FormData(); fd.append('video',b);
    fetch('/upload_evidence',{method:'POST',body:fd}).then(()=>LOG("✅ Evidence uploaded"));
  };
  rec.start(); fetch('/trigger',{method:'POST'}).then(()=>LOG("✅ Panic to HQ"));
  setTimeout(()=>{rec.stop(); LOG("Recording saved - 5s");},5000);
};
</script>
</body></html>
