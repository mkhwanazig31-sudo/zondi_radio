<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZPS Client Portal</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ffd700;
            color: #000000;
            padding: 8px 12px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .logout-link {
            color: #000000;
            text-decoration: none;
            border-bottom: 2px solid #000000;
        }
        .debug-panel {
            background-color: #111;
            border: 1px solid #ff4d4d;
            border-radius: 4px;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            color: #2ecc71;
            margin-bottom: 12px;
            min-height: 80px;
        }
        .debug-title {
            color: #ff4d4d;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }
        .panic-btn-wrapper {
            margin-bottom: 12px;
        }
        .panic-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #e60000 0%, #990000 100%);
            color: #ffffff;
            border: 1px solid #ff3333;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(230, 0, 0, 0.4);
            letter-spacing: 0.5px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .grid-tab {
            background-color: #1a1a1a;
            border: 1px solid #ff8c00;
            color: #ff8c00;
            padding: 12px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .grid-tab.secondary {
            border-color: #3498db;
            color: #3498db;
        }
        .sub-text {
            font-size: 9px;
            color: #888888;
            font-weight: normal;
        }
        .management-bar {
            background-color: #161616;
            border: 1px solid #262626;
            border-radius: 6px;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .mgmt-btn-group {
            display: flex;
            gap: 6px;
        }
        .mgmt-btn {
            padding: 5px 10px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }
        .btn-save { background-color: #28a745; color: #fff; }
        .btn-delete { background-color: #333333; color: #ccc; }
        .footer-panel {
            text-align: center;
            background: linear-gradient(0deg, #0a0a0a 0%, #151515 100%);
            border: 1px solid #222;
            border-radius: 8px;
            padding: 12px;
            font-size: 11px;
            color: #888888;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.05);
        }
        .footer-highlight {
            color: #ffd700;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- 1. PORTAL HEADER -->
    <div class="header-bar">
        <span>ZONDI - CLIENT</span>
        <span>ZPS - {{user}} <a href="/logout" class="logout-link">LOGOUT</a></span>
    </div>

    <!-- 2. SYSTEM STATUS LOG PANEL -->
    <div class="debug-panel">
        <span class="debug-title">DEBUG LOG:</span>
        <div id="logContent">
            System Operational...<br>
            Awaiting input telemetry...
        </div>
    </div>

    <!-- 3. PORTABLE SOS / EMERGENCY COMPONENT -->
    <div class="panic-btn-wrapper">
        <button id="panicBtn" onclick="triggerClientPanic()" class="panic-button">
            🚨 URGENT SOS PANIC
        </button>
    </div>

    <!-- 4. MODERN SECURITY FEATURE TABS -->
    <div class="options-grid">
        <!-- FEATURE A: CONNECT TO AN HQ AGENT -->
        <button onclick="contactControlRoom()" class="grid-tab">
            <span>📞 CHAT TO AGENT</span>
            <span class="sub-text">Open Control Room Link</span>
        </button>
       
        <!-- FEATURE B: SUBSCRIPTION/ALARM OPTIONS -->
        <button onclick="openServicePortal()" class="grid-tab secondary">
            <span>🛡️ SERVICE OPTIONS</span>
            <span class="sub-text">Escort & Alarm Status</span>
        </button>
    </div>

    <!-- 5. SETTINGS / UTILITIES MANAGEMENT BAR -->
    <div class="management-bar">
        <div style="display: flex; flex-direction: column; gap: 2px;">
            <span style="color: #ffd700; font-size: 10px; font-weight: bold; letter-spacing: 0.5px;">ACCOUNT UTILITIES</span>
            <span style="color: #666; font-size: 9px;">Profile Token: Active</span>
        </div>
        <div class="mgmt-btn-group">
            <button onclick="saveClientProfile()" class="mgmt-btn btn-save">Explicitly 💾 SAVE</button>
            <button onclick="clearClientCache()" class="mgmt-btn btn-delete">🗑️ DELETE</button>
        </div>
    </div>

    <!-- 6. AUTHORITATIVE BRAND FOOTER -->
    <div class="footer-panel">
        Designed & Developed by <a href="#" class="footer-highlight">Mkhwanazi</a>
        <br>
        <span style="color: #555; font-size: 10px; display: inline-block; margin-top: 4px;">Engine: Spark | © 2026 ZPS</span>
    </div>

    <!-- FRONTEND OPERATIONS LOGIC -->
    <script>
        function updateLog(message) {
            const logBox = document.getElementById('logContent');
            logBox.innerHTML += `<br>${message}`;
        }

        async function triggerClientPanic() {
            const btn = document.getElementById('panicBtn');
            btn.style.background = '#660000';
            btn.innerText = "⚠️ SOS BROADCASTING...";
            updateLog("<span style='color:#ff4d4d;'>🚨 SOS Triggered! Connecting to HQ Response...</span>");
           
            try {
                await fetch('/api/radio/panic', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user: '{{user}}', type: 'CLIENT_SOS' })
                });
                updateLog("✅ Telemetry received by Dispatch. Responders routing.");
            } catch (err) {
                updateLog("❌ Broadcast link failure. Retrying...");
            }
        }

        function contactControlRoom() {
            updateLog("📞 Initializing live terminal intercom channel with next available Agent...");
            alert("Connecting you to a live HQ Control Room Operator...");
        }

        function openServicePortal() {
            updateLog("📋 Fetching property security profiles...");
            alert("Opening account dashboard: Request Home Escorts, Report False Alarms, or Test Sensors.");
        }

        function saveClientProfile() {
            updateLog("💾 Local tracking layout structure properties verified.");
            alert("Client layout data saved to local secure cache storage.");
        }

        function clearClientCache() {
            if (confirm("Flush stored token buffers and reset interface data?")) {
                updateLog("🗑️ System cache memory flushed successfully.");
                alert("Interface storage wiped successfully.");
            }
        }
    </script>
</body>
</html>
